plugins {
    id 'grace.build.common'
}

configurations {
    tck {
        transitive = false
    }
    testImplementation.extendsFrom(tck)
}

dependencies {
    api project(":grace-datastore-gorm-bson")
    implementation libs.caffeine
    api libs.grace.datastore.core
    api libs.grace.datastore.gorm
    api libs.grace.datastore.gorm.validation
    api libs.grace.datastore.gorm.support
    api libs.mongodb.driver.sync

    tck libs.grace.datastore.gorm.tck
    testImplementation libs.embedmongo
    testImplementation libs.grace.datastore.gorm.test
    testImplementation libs.jakarta.validation
    testImplementation libs.javassist
    testImplementation libs.hibernate.validator
    testRuntimeOnly libs.eclipse.expressly
}

def prepareTckTests = tasks.register('prepareTckTests', Sync) { Sync it ->
    it.inputs.files(configurations.tck)
    it.outputs.upToDateWhen { false }
    it.destinationDirectory = project.layout.buildDirectory.dir('tck')
    it.from zipTree(configurations.tck.singleFile), {
        include '**/*.class'
    }
}

test {
    dependsOn(prepareTckTests)
    useJUnitPlatform()

    if (isCiBuild) {
        maxParallelForks = 1
        forkEvery = 10
    }
    else {
        maxParallelForks = 1
        forkEvery = 30
    }

    jvmArgs = ['-Xmx2048M']

    testClassesDirs = objects.fileCollection().from(prepareTckTests, testClassesDirs)
}
